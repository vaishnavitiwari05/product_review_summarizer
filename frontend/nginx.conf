server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # must be >= the backend's MAX_UPLOAD_MB, otherwise big uploads get a bare 413 from nginx
  client_max_body_size 30m;

  # API routes -> FastAPI (same origin, so the browser needs no CORS)
  location ~ ^/(health|products|upload|sample|analyze|results)(/|$) {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
}
